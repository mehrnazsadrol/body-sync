name: body_sync
description: "BodySync — a Flutter app for tracking weight, calories, and workouts."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.0
  shared_preferences: ^2.2.3
  dotted_border: ^2.0.0
  # Required as a direct dependency by `flutter gen-l10n` (generate: true below).
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    - assets/caloriesData.json
    - assets/weightData.json
    - assets/images/
